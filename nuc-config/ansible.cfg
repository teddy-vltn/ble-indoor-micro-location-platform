[defaults]
host_key_checking = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/facts
fact_caching_timeout = 86400
forks = 10
strategy = free
command_warnings = False
deprecation_warnings = False
poll_interval = 5
private_key_file = /root/.ssh/id_rsa
remote_user = admin

[ssh_connection]
pipelining = True

