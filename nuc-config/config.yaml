# Graph Positioning Configuration
graph-positioning:
  trajectory_debug: false 
  trajectory_parameters:
    average_rssi_weight: 0.7 # Signal strength weight
    beacon_count_weight: 0.3 # Quantity of log entries weight
    distance_weight: 0.2 # Player travel distance weight
    distance_min: 0 # Minimum distance to consider ponderation by distance weight
    distance_max: 4 # Maximum distance to consider ponderation by distance weight
    rssi_min: -94 # Minimum signal strength to consider ponderation by signal strength weight
    rssi_max: -56 # Maximum signal strength to consider ponderation by signal strength weight
    confidence_threshold: 0.2 # Minimum confidence to consider a trajectory
  time_interval_of_groups: 8 # Time interval in minutes to group log entries
  scheduler_settings:
    start_delay: 1 # Delay in minutes to start the scheduler
    interval: 15 # Interval in minutes to run the algorithm
    priority: 1 # Priority of the scheduler

  test_dataset: "musee" # Test dataset to use if in test folder

# Ansible Playbooks Configuration
ansible-playbooks:
  start:
    name: Start
    description: Start all services on the selected hosts
    playbooks:
      '1':
        path: ansible/playbooks/control-ntp.yml
      '2':
        path: ansible/playbooks/control-script.yml
        vars:
          action: start
  stop:
    name: Stop
    description: Stop all services on the selected hosts
    playbooks:
      '1':
        path: ansible/playbooks/control-script.yml
        vars:
          action: stop
  update-rasplog:
    name: Update Rasplog
    description: Update the Rasplog service on the selected hosts
    playbooks:
      '1':
        path: ansible/playbooks/git-pull.yml
        vars:
          gitlab_access_token: true
          repo_url: github.com/teddy-vltn/rasp/rasp-logs.git
          slug: rasp-logs
          branch: main
  update-filebeat:
    name: Update Filebeat
    description: Update the Filebeat service on the selected hosts
    playbooks:
      '1':
        path: ansible/playbooks/git-pull.yml
        vars:
          gitlab_access_token: true
          repo_url: github.com/teddy-vltn/rasp/rasp-filebeat.git
          slug: rasp-filebeat
          branch: main
  update-webserver:
    name: Update Webserver
    description: Update the Webserver service on the selected hosts
    playbooks:
      '1':
        path: ansible/playbooks/git-pull.yml
        vars:
          gitlab_access_token: true
          repo_url: github.com/teddy-vltn/rasp/rasp-webserver.git
          slug: rasp-webserver
          branch: main
  first-setup:
    name: First Setup
    description: First setup to install required packages (like git) on the selected hosts
    playbooks:
      '1':
        path: ansible/playbooks/setup.yml
