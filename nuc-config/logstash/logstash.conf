input {
  beats {
    port => 5044
  }
}

filter {
  grok {
    match => { "message" => "%{WORD:hostname},%{NUMBER:timestamp:float},%{NUMBER:major:int},%{NUMBER:minor:int},%{NUMBER:tx_power:int},%{NUMBER:rssi:int}" }
  }
}

output {
  mongodb {
    uri => "${MONGODB_URI}"
    database => "${MONGODB_DATABASE}"
    collection => "${LOGSTASH_LOGS_COLLECTION}"
    codec => "json"
  }
}

